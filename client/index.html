    <meta property="og:title" content="Arqa — автосервис в Кокшетау" />

    <title>Arqa — автосервис в Кокшетау | Диагностика и ремонт авто</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "AutoRepair",
        "name": "Arqa",
        "description": "Диагностика и ремонт легковых автомобилей в Кокшетау.",
        "telephone": "+7 771 256 66 91",
        "url": "{{SITE_URL}}/",
        "priceRange": "₸₸",
        "openingHours": "Mo-Su 10:00-22:00",
        "address": {"@type":"PostalAddress","addressLocality":"Кокшетау","streetAddress":"ул. Шагалалы, 1/1","addressCountry":"KZ"},
        "sameAs": ["https://2gis.kz/kokshetau/firm/70000001068594936","https://instagram.com/arqa_avto_kompleks"]
      }

    <!-- Fonts are self-hosted in /fonts with font-display:swap (see index.css).
         Deliberately NOT preloaded: measurements showed even one font preload
         worsens real LCP (195ms -> 291ms) by crowding the critical window;
         swap covers the fallback-to-webfont transition. -->
    <link rel="preload" as="image" href="/assets/facade-960.webp" fetchpriority="high" />
  </head>
  <body>
    <!-- Boot hero: paints the LCP poster before React loads. Lives outside #root
         so React cannot replace it (which would re-trigger LCP); hidden on mount. -->
    <div class="boot-hero" aria-hidden="true">
      <img src="/assets/facade-960.webp" width="960" height="720" alt="" fetchpriority="high" />
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
